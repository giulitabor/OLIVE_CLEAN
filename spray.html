<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Field Ops — Villa Toscagialla</title>
    <style>
        :root {
            --gold: #C5A059;
            --dusk: #050505;
            --blue: #3b82f6;
            --olive: #5a7a2b;
            --brown: #8a6d3b;
            --harvest: #a855f7;
        }
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #000;
            color: #f5eed8;
            font-family: Arial, sans-serif;
            margin: 0;
            padding-bottom: 200px;
        }
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(0,0,0,0.97);
            border-bottom: 1px solid #222;
            padding: 12px 14px;
        }
        .header-top, .header-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-bottom {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #111;
        }
        .title {
            margin: 0;
            color: var(--gold);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 7px 12px;
            border-radius: 4px;
            font-size: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn.blue {
            border-color: var(--blue);
            color: var(--blue);
        }

        /* ---- YOU-ARE-HERE BAR ---- */
        .locate-bar {
            position: sticky;
            top: 0;
            z-index: 900;
            background: #0b0b0b;
            border-bottom: 1px solid #222;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .locate-row {
            font-size: 13px;
            font-weight: bold;
            color: #fff;
            white-space: nowrap;
        }
        .locate-row span {
            color: var(--gold);
        }
        .locate-progress-track {
            flex: 1;
            height: 6px;
            background: #1a1a1a;
            border-radius: 4px;
            overflow: hidden;
        }
        .locate-progress-fill {
            height: 100%;
            background: var(--harvest);
            width: 0%;
            transition: width .25s;
        }
        .locate-pct {
            font-size: 10px;
            opacity: 0.7;
            white-space: nowrap;
        }

        /* ---- MINI FIELD MAP ---- */
        .minimap-wrap {
            position: sticky;
            top: 41px;
            z-index: 850;
            background: #0b0b0b;
            border-bottom: 1px solid #222;
            padding: 8px 12px 10px;
        }
        .minimap-label {
            font-size: 9px;
            opacity: 0.5;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .minimap {
            display: flex;
            flex-direction: column;
            gap: 1.5px;
            width: 100%;
        }
        .minimap-row {
            display: grid;
            grid-template-columns: repeat(14, 1fr);
            gap: 1.5px;
            height: 7px;
            border-radius: 2px;
            position: relative;
            cursor: pointer;
        }
        .minimap-row.current {
            outline: 1.5px solid #fff;
            outline-offset: 1px;
        }
        .minimap-cell {
            border-radius: 1px;
            background: transparent;
        }
        .minimap-cell.tree { background: #333; }
        .minimap-cell.tree.harvested { background: var(--harvest); }

        /* CANVAS CONTAINER */
        .wrapper {
            overflow: auto;
            padding: 20px;
        }
        .canvas {
            width: max-content;
            padding: 10px;
        }
        .row-container {
            margin-bottom: 20px;
            background: rgba(255,255,255,0.01);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #111;
            scroll-margin-top: 110px;
        }
        .row-container.flash {
            animation: flashRow 1.4s ease;
        }
        @keyframes flashRow {
            0%, 100% { border-color: #111; }
            30% { border-color: var(--harvest); box-shadow: 0 0 16px rgba(168,85,247,0.5); }
        }
        .row-label {
            font-size: 11px;
            color: var(--gold);
            font-weight: bold;
            margin-bottom: 12px;
            text-transform: uppercase;
            border-left: 3px solid var(--gold);
            padding-left: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .row-progress {
            color: #888;
            font-size: 9px;
            font-weight: normal;
            text-transform: none;
        }

        /* Strict 14-Column Layout Sourced directly from look2.html Matrix Dimensions */
        .tree-grid {
            display: grid;
            grid-template-columns: repeat(14, 1fr);
            gap: 6px;
        }

        /* ACTION OPERATIONAL CARDS */
        .tree-card {
            background: #111;
            border: 1px solid #222;
            border-radius: 4px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 76px;
        }
        .tree-card.empty {
            visibility: hidden;
            pointer-events: none;
        }
        .tree-card.sprayed {
            border-color: var(--blue);
            background: rgba(59, 130, 246, 0.08);
        }
        .tree-card.harvested {
            border-color: var(--harvest);
            background: rgba(168, 85, 247, 0.12);
        }
        .tree-card.harvested.sprayed {
            border-image: linear-gradient(135deg, var(--blue), var(--harvest)) 1;
        }
        .tree-card.target-flash {
            animation: targetPulse 1.4s ease;
        }
        @keyframes targetPulse {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.12); box-shadow: 0 0 14px rgba(168,85,247,0.9); }
        }

        /* Genesis Initial 3-Tree Variant Layouts */
        .tree-card.genesis {
            border-color: var(--gold);
            background: linear-gradient(145deg, #16120a, #111);
        }
        .tree-card.genesis .card-id {
            color: #fff;
            text-shadow: 0 0 4px var(--gold);
        }

        .card-id {
            font-size: 10px;
            font-weight: bold;
            color: var(--gold);
        }
        .toggle-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }
        .spray-toggle, .harvest-toggle {
            background: transparent;
            border: 1px solid #333;
            color: #777;
            font-size: 9px;
            padding: 4px 2px;
            border-radius: 3px;
            text-transform: uppercase;
            cursor: pointer;
            font-weight: bold;
        }
        .sprayed .spray-toggle {
            background: var(--blue);
            border-color: var(--blue);
            color: white;
        }
        .harvested .harvest-toggle {
            background: var(--harvest);
            border-color: var(--harvest);
            color: white;
        }

        .cycle-box {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
        }
        .btn-cycle {
            background: #222;
            border: none;
            color: #555;
            font-size: 9px;
            padding: 8px 0;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
        }
        .active-S { background: var(--brown) !important; color: white !important; }
        .active-M { background: var(--olive) !important; color: white !important; }
        .active-A { background: var(--gold) !important; color: black !important; font-weight: bold; }

        /* FLOATING NAV */
        .float-nav {
            position: fixed;
            right: 12px;
            bottom: 210px;
            z-index: 950;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .fab {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: #151515;
            border: 1px solid var(--gold);
            color: var(--gold);
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0,0,0,0.6);
        }
        .fab.next-target {
            background: var(--harvest);
            border-color: var(--harvest);
            color: #fff;
            font-size: 10px;
            width: 56px;
            height: 56px;
        }

        /* FIXED SYSTEM FOOTER */
        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #000;
            border-top: 1px solid #222;
            padding: 15px;
            z-index: 1000;
        }
        .legend {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 8px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
        }
        .box {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }
        .small {
            font-size: 10px;
            opacity: .6;
        }
    </style>
</head>
<body>

<header>
    <div class="header-top">
        <div>
            <h1 class="title">Villa Toscagialla Matrix</h1>
            <div id="counter" class="small">0 / 0 Sprayed · 0 / 0 Harvested</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;font-size:11px;">
            <span>GPS</span>
            <label class="switch">
                <input type="checkbox" id="gps-toggle">
                <span class="slider"></span>
            </label>
        </div>
    </div>
    <div class="header-bottom">
        <div class="small">
            <span id="w-temp">--°C</span> | <span id="w-hum">--%</span> | <span id="gps-display" style="color:#ff4444;">GPS OFF</span>
        </div>
        <div>
            <button class="btn" id="export-btn">EXPORT</button>
            <button class="btn blue" id="import-btn">IMPORT</button>
            <input type="file" id="file-input" hidden />
        </div>
    </div>
</header>

<!-- YOU ARE HERE -->
<div class="locate-bar">
    <div class="locate-row">ROW <span id="locate-row-num">1</span> / <span id="locate-row-total">21</span></div>
    <div class="locate-progress-track"><div class="locate-progress-fill" id="locate-progress-fill"></div></div>
    <div class="locate-pct" id="locate-pct">0%</div>
</div>

<!-- MINI FIELD MAP -->
<div class="minimap-wrap">
    <div class="minimap-label">Field overview — tap a row to jump</div>
    <div class="minimap" id="minimap"></div>
</div>

<div class="wrapper">
    <div class="canvas" id="canvas"></div>
</div>

<div class="float-nav">
    <div class="fab" id="prev-row-btn">▲</div>
    <div class="fab" id="next-row-btn">▼</div>
    <div class="fab next-target" id="next-target-btn">NEXT<br>TREE</div>
</div>

<footer>
    <div class="legend">
        <div class="legend-item"><div class="box" style="border: 1px solid var(--blue); background: rgba(59,130,246,0.2);"></div> Sprayed</div>
        <div class="legend-item"><div class="box" style="border: 1px solid var(--harvest); background: rgba(168,85,247,0.25);"></div> Harvested</div>
        <div class="legend-item"><div class="box" style="background: var(--brown);"></div> S: Sparse</div>
        <div class="legend-item"><div class="box" style="background: var(--olive);"></div> M: Medium</div>
    </div>
    <div style="font-size: 9px; opacity: 0.4; text-align: center; margin-top: 4px;">M: Mignola | P: Preflower | O: Olives — tap "Next Tree" to jump to the next unharvested tree</div>
</footer>

<style>
    /* GPS ACCURACY SWITCH (kept with original styling, placed after footer styles intentionally) */
    .switch { position: relative; display: inline-block; width: 34px; height: 20px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #333; border-radius: 20px; transition: .3s; cursor: pointer; }
    .slider:before { content: ''; position: absolute; width: 14px; height: 14px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: .3s; }
    input:checked + .slider { background: var(--gold); }
    input:checked + .slider:before { transform: translateX(14px); }
</style>

<script>
    const G='g', Y='y', R='r', B='b', E='e';
    const levels = ["-", "S", "M", "A"];
    let gpsWatch = null;
    let currentRowIndex = 0;

    // Direct structural layout matching look2.html with corrections included
    const grid = [
        [Y,Y,G,R,Y,R,G,Y,Y,Y,Y,R,R,Y], // Row 1
        [B,B,Y,Y,B,E,E,G,B,B,Y,Y,R,Y], // Row 2
        [B,Y,B,Y,G,E,E,Y,G,G,Y,Y,Y,Y], // Row 3
        [B,Y,Y,Y,B,G,G,G,G,Y,R,Y,Y,B], // Row 4
        [Y,Y,B,B,G,G,G,G,R,B,Y,Y,B,B], // Row 5
        [G,G,G,G,G,G,R,R,G,G,G,G,G,G], // Row 6
        [Y,Y,R,G,G,G,G,G,G,G,G,G,G,Y], // Row 7
        [G,G,G,G,G,G,G,Y,Y,G,G,G,G,G], // Row 8
        [G,G,G,G,G,G,R,G,G,G,G,G,G,G], // Row 9
        [Y,Y,G,G,G,G,G,G,G,G,G,G,G,E], // Row 10
        [Y,G,G,G,G,G,G,G,G,G,G,G,E,G], // Row 11 (Modified: column 13 changed from E to G)
        [G,G,G,G,G,G,G,Y,G,G,G,G,G,G], // Row 12
        [G,G,G,G,G,G,G,G,E,E,E,E,E,E], // Row 13
        [G,G,G,G,G,G,G,G,E,E,E,E,E,E], // Row 14
        [G,G,G,G,G,G,Y,G,E,E,E,E,E,E], // Row 15
        [G,G,G,G,G,G,G,G,E,E,E,E,E,E], // Row 16
        [G,G,G,G,G,G,G,G,E,E,E,E,E,E], // Row 17
        [G,G,G,Y,G,G,G,G,E,E,E,E,E,E], // Row 18
        [E,G,G,E,E,E,G,G,E,E,E,E,E,E], // Row 19
        [E,E,E,E,B,E,G,E,E,E,E,E,E,E], // Row 20
        [G,G,E,G,E,G,G,G,E,E,E,E,E,E]  // Row 21
    ];

    let treeData = {};
    const canvas = document.getElementById('canvas');
    const minimapEl = document.getElementById('minimap');
    let rowObserver = null;

    // Precompute which global tree ids fall in which row, for progress + navigation
    function buildRowIndex() {
        const rowIds = [];
        let id = 1;
        grid.forEach(rowData => {
            const ids = [];
            rowData.forEach(cell => {
                if (cell !== E) { ids.push(id); id++; }
            });
            rowIds.push(ids);
        });
        return rowIds;
    }
    const rowIds = buildRowIndex();

    function render() {
        canvas.innerHTML = '';
        let globalTreeId = 1;

        grid.forEach((rowData, rowIndex) => {
            const rowContainer = document.createElement('div');
            rowContainer.className = 'row-container';
            rowContainer.dataset.rowIndex = rowIndex;
            rowContainer.id = `row-${rowIndex}`;

            const label = document.createElement('div');
            label.className = 'row-label';
            label.innerHTML = `<span>Row ${rowIndex + 1}</span><span class="row-progress" id="rp-${rowIndex}"></span>`;
            rowContainer.appendChild(label);

            const treeGrid = document.createElement('div');
            treeGrid.className = 'tree-grid';

            rowData.forEach((cell) => {
                const card = document.createElement('div');
                card.className = 'tree-card';

                if (cell === E) {
                    card.classList.add('empty');
                } else {
                    const id = globalTreeId;
                    globalTreeId++;
                    card.id = `tree-${id}`;

                    if (!treeData[id]) {
                        treeData[id] = { sprayed: false, harvested: false, m: 0, p: 0, o: 0 };
                    }
                    if (treeData[id].harvested === undefined) treeData[id].harvested = false;

                    if (treeData[id].sprayed) card.classList.add('sprayed');
                    if (treeData[id].harvested) card.classList.add('harvested');
                    if (id <= 3) card.classList.add('genesis');

                    card.innerHTML = `
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <span class="card-id">#${id}</span>
                        </div>
                        <div class="toggle-row">
                            <button onclick="toggleSpray(event, ${id}, this)" class="spray-toggle">
                                ${treeData[id].sprayed ? "Sprayed" : "Spray"}
                            </button>
                            <button onclick="toggleHarvest(event, ${id}, this)" class="harvest-toggle">
                                ${treeData[id].harvested ? "Picked" : "Harvest"}
                            </button>
                        </div>
                        <div class="cycle-box">
                            <button onclick="cycleValue(event, ${id}, 'm', this)" class="btn-cycle ${treeData[id].m > 0 ? 'active-'+levels[treeData[id].m] : ''}">${treeData[id].m > 0 ? levels[treeData[id].m] : 'M'}</button>
                            <button onclick="cycleValue(event, ${id}, 'p', this)" class="btn-cycle ${treeData[id].p > 0 ? 'active-'+levels[treeData[id].p] : ''}">${treeData[id].p > 0 ? levels[treeData[id].p] : 'P'}</button>
                            <button onclick="cycleValue(event, ${id}, 'o', this)" class="btn-cycle ${treeData[id].o > 0 ? 'active-'+levels[treeData[id].o] : ''}">${treeData[id].o > 0 ? levels[treeData[id].o] : 'O'}</button>
                        </div>
                    `;
                }
                treeGrid.appendChild(card);
            });

            rowContainer.appendChild(treeGrid);
            canvas.appendChild(rowContainer);
        });

        buildMinimap();
        updateCounter();
        updateRowProgress();
        setupRowObserver();
    }

    function buildMinimap() {
        minimapEl.innerHTML = '';
        grid.forEach((rowData, rowIndex) => {
            const mRow = document.createElement('div');
            mRow.className = 'minimap-row';
            mRow.dataset.rowIndex = rowIndex;
            rowData.forEach((cell, colIndex) => {
                const mCell = document.createElement('div');
                if (cell === E) {
                    mCell.className = 'minimap-cell';
                } else {
                    const id = rowIds[rowIndex][countTreesBefore(rowData, colIndex)];
                    mCell.className = 'minimap-cell tree';
                    mCell.dataset.treeId = id;
                }
                mRow.appendChild(mCell);
            });
            mRow.onclick = () => jumpToRow(rowIndex, true);
            minimapEl.appendChild(mRow);
        });
    }

    function countTreesBefore(rowData, colIndex) {
        let c = 0;
        for (let i = 0; i < colIndex; i++) if (rowData[i] !== E) c++;
        return c;
    }

    function refreshMinimapHarvestColors() {
        document.querySelectorAll('.minimap-cell.tree').forEach(el => {
            const id = el.dataset.treeId;
            if (treeData[id] && treeData[id].harvested) el.classList.add('harvested');
            else el.classList.remove('harvested');
        });
    }

    function setupRowObserver() {
        if (rowObserver) rowObserver.disconnect();
        rowObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    currentRowIndex = parseInt(entry.target.dataset.rowIndex);
                    updateLocateBar();
                }
            });
        }, { rootMargin: '-40% 0px -50% 0px', threshold: 0 });
        document.querySelectorAll('.row-container').forEach(el => rowObserver.observe(el));
    }

    function updateLocateBar() {
        document.getElementById('locate-row-num').innerText = currentRowIndex + 1;
        document.getElementById('locate-row-total').innerText = grid.length;
        document.querySelectorAll('.minimap-row').forEach(el => {
            el.classList.toggle('current', parseInt(el.dataset.rowIndex) === currentRowIndex);
        });
        const ids = rowIds[currentRowIndex];
        const done = ids.filter(id => treeData[id] && treeData[id].harvested).length;
        const pct = ids.length ? Math.round((done / ids.length) * 100) : 0;
        document.getElementById('locate-progress-fill').style.width = pct + '%';
        document.getElementById('locate-pct').innerText = `${done}/${ids.length} picked`;
    }

    function updateRowProgress() {
        grid.forEach((rowData, rowIndex) => {
            const ids = rowIds[rowIndex];
            const done = ids.filter(id => treeData[id] && treeData[id].harvested).length;
            const el = document.getElementById(`rp-${rowIndex}`);
            if (el) el.innerText = ids.length ? `${done}/${ids.length} picked` : '';
        });
        updateLocateBar();
        refreshMinimapHarvestColors();
    }

    function jumpToRow(rowIndex, flash) {
        const el = document.getElementById(`row-${rowIndex}`);
        if (!el) return;
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        if (flash) {
            el.classList.add('flash');
            setTimeout(() => el.classList.remove('flash'), 1400);
        }
    }

    document.getElementById('prev-row-btn').onclick = () => jumpToRow(Math.max(0, currentRowIndex - 1));
    document.getElementById('next-row-btn').onclick = () => jumpToRow(Math.min(grid.length - 1, currentRowIndex + 1));

    document.getElementById('next-target-btn').onclick = () => {
        let total = 0;
        grid.forEach(r => r.forEach(c => { if (c !== E) total++; }));
        let targetId = null;
        for (let id = 1; id <= total; id++) {
            if (!treeData[id] || !treeData[id].harvested) { targetId = id; break; }
        }
        if (!targetId) { alert('All trees harvested! 🎉'); return; }
        const card = document.getElementById(`tree-${targetId}`);
        if (card) {
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            card.classList.add('target-flash');
            setTimeout(() => card.classList.remove('target-flash'), 1400);
        }
    };

    window.toggleSpray = (e, id, btn) => {
        e.stopPropagation();
        const isSprayed = !treeData[id].sprayed;
        treeData[id].sprayed = isSprayed;

        const card = btn.closest('.tree-card');
        if (isSprayed) {
            card.classList.add('sprayed');
            btn.innerText = "Sprayed";

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    treeData[id].gps = {
                        lat: pos.coords.latitude,
                        lng: pos.coords.longitude,
                        acc: pos.coords.accuracy
                    };
                    treeData[id].timestamp = new Date().toISOString();
                    save();
                }, null, { enableHighAccuracy: true });
            }
        } else {
            card.classList.remove('sprayed');
            btn.innerText = "Spray";
            if (treeData[id].gps) delete treeData[id].gps;
            if (treeData[id].timestamp) delete treeData[id].timestamp;
        }

        save();
        updateCounter();
    };

    window.toggleHarvest = (e, id, btn) => {
        e.stopPropagation();
        const isHarvested = !treeData[id].harvested;
        treeData[id].harvested = isHarvested;

        const card = btn.closest('.tree-card');
        if (isHarvested) {
            card.classList.add('harvested');
            btn.innerText = "Picked";
            treeData[id].harvestedAt = new Date().toISOString();
        } else {
            card.classList.remove('harvested');
            btn.innerText = "Harvest";
            delete treeData[id].harvestedAt;
        }

        save();
        updateCounter();
        updateRowProgress();
    };

    window.cycleValue = (e, id, key, btn) => {
        e.stopPropagation();
        treeData[id][key] = ((treeData[id][key] || 0) + 1) % 4;
        const val = treeData[id][key];

        btn.innerText = val === 0 ? key.toUpperCase() : levels[val];
        btn.className = `btn-cycle ${val > 0 ? 'active-' + levels[val] : ''}`;

        save();
    };

    function save() {
        localStorage.setItem('olive_tracker_walk_data', JSON.stringify({ treeData }));
    }

    function load() {
        const saved = localStorage.getItem('olive_tracker_walk_data');
        if (saved) {
            const data = JSON.parse(saved);
            treeData = data.treeData || {};
        }
    }

    function updateCounter() {
        let total = 0;
        grid.forEach(r => r.forEach(c => { if (c !== E) total++; }));
        const sprayed = Object.values(treeData).filter(t => t.sprayed).length;
        const harvested = Object.values(treeData).filter(t => t.harvested).length;
        document.getElementById('counter').innerText = `${sprayed} / ${total} Sprayed · ${harvested} / ${total} Harvested`;
    }

    document.getElementById('gps-toggle').addEventListener('change', (e) => {
        const display = document.getElementById('gps-display');
        if (e.target.checked) {
            gpsWatch = navigator.geolocation.watchPosition((pos) => {
                display.innerText = `±${Math.round(pos.coords.accuracy)}m`;
                display.style.color = '#10b981';
            }, null, { enableHighAccuracy: true });
        } else {
            navigator.geolocation.clearWatch(gpsWatch);
            display.innerText = 'GPS OFF';
            display.style.color = '#ff4444';
        }
    });

    document.getElementById('export-btn').onclick = () => {
        const blob = new Blob([JSON.stringify({ treeData }, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `olive_field_walk_${Date.now()}.json`;
        a.click();
    };

    document.getElementById('import-btn').onclick = () => document.getElementById('file-input').click();

    document.getElementById('file-input').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const imported = JSON.parse(ev.target.result);
                treeData = imported.treeData || {};
                save();
                render();
                alert('Import successful');
            } catch (err) {
                alert('Invalid JSON File');
            }
        };
        reader.readAsText(file);
    });

    async function fetchWeather() {
        try {
            const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=43.05&longitude=10.54&current_weather=true&relative_humidity_2m=true`);
            const data = await res.json();
            document.getElementById('w-temp').innerText = Math.round(data.current_weather.temperature) + "°C";
            document.getElementById('w-hum').innerText = data.hourly.relative_humidity_2m[0] + "%";
        } catch (e) {}
    }

    load();
    render();
    fetchWeather();
</script>

</body>
</html>
