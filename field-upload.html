<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Olivium — Field Update</title>
<style>
  :root{
    --forest:#17301c;
    --olive:#5b6e28;
    --cream:#f7f5ea;
    --radius:16px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--cream);color:var(--forest);
    display:flex;justify-content:center;
  }
  .wrap{width:100%;max-width:480px;padding:24px 20px 60px}
  header{text-align:center;margin-bottom:22px}
  header .mark{font-size:28px}
  header h1{font-family:Georgia,serif;font-size:22px;margin:6px 0 2px;letter-spacing:.5px}
  header p{font-size:13px;color:#6c7269;margin:0}

  .card{
    background:#fff;border-radius:var(--radius);padding:18px;
    box-shadow:0 6px 20px rgba(23,48,28,.06);margin-bottom:16px
  }
  label{display:block;font-size:12px;font-weight:700;color:var(--forest);margin-bottom:8px;letter-spacing:.3px;text-transform:uppercase}

  .photo-input{
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    border:2px dashed #c9cdb8;border-radius:12px;padding:28px 10px;cursor:pointer;
    background:#fbfaf3;transition:.2s;text-align:center
  }
  .photo-input:active{background:#f0efe0}
  .photo-input .icon{font-size:30px;margin-bottom:6px}
  .photo-input span{font-size:13px;color:#6c7269}
  input[type=file]{display:none}

  .thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .thumb{position:relative;width:72px;height:72px;border-radius:9px;overflow:hidden;background:#eee}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .thumb .remove{
    position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;
    border:0;border-radius:50%;width:20px;height:20px;font-size:12px;line-height:20px;
    text-align:center;cursor:pointer;padding:0
  }

  textarea{
    width:100%;border:1px solid #e2dfd3;border-radius:10px;padding:12px;font-size:14px;
    font-family:inherit;resize:vertical;min-height:90px;background:#fbfaf3
  }

  .gps-row{display:flex;align-items:center;justify-content:space-between;font-size:13px}
  .gps-row button{
    background:#eceadb;border:0;border-radius:8px;padding:8px 12px;font-size:12px;
    font-weight:700;color:var(--forest);cursor:pointer
  }
  .gps-status{color:#6c7269;font-size:12px}
  .gps-status.ok{color:var(--olive);font-weight:700}

  .submit-btn{
    width:100%;background:var(--olive);color:#fff;border:0;border-radius:12px;
    padding:15px;font-size:15px;font-weight:800;cursor:pointer;letter-spacing:.3px
  }
  .submit-btn:disabled{opacity:.55;cursor:default}

  .toast{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);
    background:var(--forest);color:#fff;padding:14px 20px;border-radius:12px;
    font-size:13px;box-shadow:0 15px 35px rgba(0,0,0,.25);transition:.35s;z-index:100;
    max-width:90%;text-align:center
  }
  .toast.show{transform:translate(-50%,0)}
  .toast.error{background:#7a2a2a}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark">🌿</div>
    <h1>Field Update</h1>
    <p>Add today's photos and a quick note from the grove</p>
  </header>

  <div class="card">
    <label>Photos</label>
    <div class="photo-input" id="photo-trigger">
      <div class="icon">📷</div>
      <span>Tap to take or choose photos</span>
    </div>
    <input type="file" id="photo-input" accept="image/*" capture="environment" multiple>
    <div class="thumbs" id="thumbs"></div>
  </div>

  <div class="card">
    <label>Note</label>
    <textarea id="note" placeholder="e.g. Trees looking good after the heat. Checking for olive fly activity."></textarea>
  </div>

  <div class="card">
    <label>Location</label>
    <div class="gps-row">
      <span class="gps-status" id="gps-status">No location recorded</span>
      <button type="button" id="gps-btn">Record GPS</button>
    </div>
  </div>

  <button class="submit-btn" id="submit-btn">Upload Field Update</button>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
  var SUPABASE_URL = "https://kqfqryeptkbvlkekocpx.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_OT4DPbehnS1epTUXbd5pYg_Tdv2-He-";
  var BUCKET = "photos_olivium";
  var client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var photoTrigger = document.getElementById('photo-trigger');
  var photoInput = document.getElementById('photo-input');
  var thumbsEl = document.getElementById('thumbs');
  var noteEl = document.getElementById('note');
  var gpsBtn = document.getElementById('gps-btn');
  var gpsStatus = document.getElementById('gps-status');
  var submitBtn = document.getElementById('submit-btn');
  var toast = document.getElementById('toast');

  var selectedFiles = [];
  var gpsCoords = null;

  photoTrigger.addEventListener('click', function(){ photoInput.click(); });

  photoInput.addEventListener('change', function(e){
    var files = Array.from(e.target.files || []);
    files.forEach(function(f){ selectedFiles.push(f); });
    renderThumbs();
    photoInput.value = ""; // allow picking again
  });

  function renderThumbs(){
    thumbsEl.innerHTML = "";
    selectedFiles.forEach(function(file, idx){
      var thumb = document.createElement('div');
      thumb.className = 'thumb';
      var img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      var removeBtn = document.createElement('button');
      removeBtn.className = 'remove';
      removeBtn.textContent = '×';
      removeBtn.onclick = function(){
        selectedFiles.splice(idx, 1);
        renderThumbs();
      };
      thumb.appendChild(img);
      thumb.appendChild(removeBtn);
      thumbsEl.appendChild(thumb);
    });
  }

  gpsBtn.addEventListener('click', function(){
    if (!navigator.geolocation){
      gpsStatus.textContent = "GPS not supported on this device";
      return;
    }
    gpsStatus.textContent = "Locating…";
    navigator.geolocation.getCurrentPosition(
      function(pos){
        gpsCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        gpsStatus.textContent = "Location recorded ✓";
        gpsStatus.classList.add('ok');
      },
      function(err){
        gpsStatus.textContent = "Couldn't get location (" + err.message + ")";
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  });

  function showToast(msg, isError){
    toast.textContent = msg;
    toast.classList.toggle('error', !!isError);
    toast.classList.add('show');
    setTimeout(function(){ toast.classList.remove('show'); }, 3500);
  }

  function todayFolder(){
    var d = new Date();
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return y + "-" + m + "-" + day;
  }

  async function uploadPhotos(){
    var folder = todayFolder();
    var paths = [];
    for (var i = 0; i < selectedFiles.length; i++){
      var file = selectedFiles[i];
      var safeName = Date.now() + "_" + i + "_" + file.name.replace(/[^a-zA-Z0-9.\-_]/g, "");
      var path = folder + "/" + safeName;
      var { error } = await client.storage.from(BUCKET).upload(path, file, {
        contentType: file.type,
        upsert: false
      });
      if (error) throw error;
      paths.push(path);
    }
    return paths;
  }

  submitBtn.addEventListener('click', async function(){
    var note = noteEl.value.trim();
    if (selectedFiles.length === 0 && !note){
      showToast("Add at least a photo or a note first", true);
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Uploading…";

    try {
      var photoPaths = await uploadPhotos();

      var row = {
        note: note || null,
        photo_paths: photoPaths,
        gps_lat: gpsCoords ? gpsCoords.lat : null,
        gps_lng: gpsCoords ? gpsCoords.lng : null
      };

      var { error } = await client.from('field_entries').insert(row);
      if (error) throw error;

      showToast("Field update uploaded ✓");
      selectedFiles = [];
      renderThumbs();
      noteEl.value = "";
      gpsCoords = null;
      gpsStatus.textContent = "No location recorded";
      gpsStatus.classList.remove('ok');
    } catch (err){
      console.error(err);
      showToast("Upload failed: " + (err.message || "unknown error"), true);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Upload Field Update";
    }
  });
})();
</script>
</body>
</html>
